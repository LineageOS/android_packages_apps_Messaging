[package]
name = "rcs_mls_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Vendored fork of mls-rs 0.55.2 — carries the RCS-revive patches (SELF_REMOVE-in-external-commit,
# batch_edit external_leaf target resolution). See external/mls-rs/mls-rs/PATCHES.md. Path dep (not
# a registry edit) so cargo actually recompiles the patched sources and the fork is reproducible/committed.
mls-rs = { path = "../../../../../external/mls-rs/mls-rs", features = ["last_resort_key_package_ext", "self_remove_proposal", "export_key_generation", "secret_tree_access", "prior_epoch_membership_key", "gsma_rcs_e2ee_feature"] }
mls-rs-core = "0.27"
mls-rs-crypto-rustcrypto = { version = "0.22", features = ["x509"] }
mls-rs-identity-x509 = "0.21"
zeroize = "1"
getrandom = "0.2"
der = "0.7"
x509-cert = "0.2"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
